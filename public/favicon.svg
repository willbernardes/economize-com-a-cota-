<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- CotaFácil circular mark: segments in orange/yellow/green -->
  <defs>
    <linearGradient id="segOrange" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FF7F2A"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
  </defs>
  <!-- Transparent background for better theming -->
  <g transform="translate(32,32)">
    <!-- Base ring -->
    <circle r="20" fill="none" stroke="#E6EEF3" stroke-width="12" opacity="0.9"/>
    <!-- Orange segment -->
    <path d="M0 -20 A20 20 0 0 1 17 -10" fill="none" stroke="url(#segOrange)" stroke-width="12" stroke-linecap="round"/>
    <!-- Yellow segment -->
    <path d="M17 -10 A20 20 0 0 1 5 19" fill="none" stroke="#FFC24D" stroke-width="12" stroke-linecap="round"/>
    <!-- Green segment -->
    <path d="M5 19 A20 20 0 0 1 -12 16" fill="none" stroke="#26A65B" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
